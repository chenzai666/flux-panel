name: 构建并推送镜像

env:
  VERSION: "1.6.16"

on:
  push:
    branches:
      - main

jobs:
  build-gost:
    name: 编译 GOST 二进制
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: 配置 Go 环境
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: 缓存 Go 模块
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: 安装 UPX
        run: |
          wget https://github.com/upx/upx/releases/download/v4.2.1/upx-4.2.1-amd64_linux.tar.xz
          tar -xf upx-4.2.1-amd64_linux.tar.xz
          sudo mv upx-4.2.1-amd64_linux/upx /usr/local/bin/
          rm -rf upx-4.2.1-amd64_linux*

      - name: 编译 AMD64
        working-directory: ./go-gost
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X main.panelVersion=${{ env.VERSION }}" -o gost-amd64

      - name: 编译 ARM64
        working-directory: ./go-gost
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w -X main.panelVersion=${{ env.VERSION }}" -o gost-arm64

      - name: UPX 压缩 AMD64
        working-directory: ./go-gost
        run: upx --best --lzma gost-amd64

      - name: UPX 压缩 ARM64
        working-directory: ./go-gost
        run: upx --best --lzma gost-arm64

      - name: 上传 AMD64 产物
        uses: actions/upload-artifact@v4
        with:
          name: gost-binary-amd64
          path: ./go-gost/gost-amd64

      - name: 上传 ARM64 产物
        uses: actions/upload-artifact@v4
        with:
          name: gost-binary-arm64
          path: ./go-gost/gost-arm64

  build-vite:
    name: 构建并推送前端镜像
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 配置 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: 构建并推送前端镜像
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push \
            --build-arg VERSION=${{ env.VERSION }} \
            -t bats666/vite-frontend:latest \
            -t bats666/vite-frontend:${{ env.VERSION }} \
            ./vite-frontend

  build-java:
    name: 构建并推送后端镜像
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: 配置 JDK
        uses: actions/setup-java@v3
        with:
          java-version: 21
          distribution: 'temurin'

      - name: 缓存 Maven 依赖
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: 编译 JAR
        working-directory: ./springboot-backend
        run: mvn clean package -DskipTests

      - name: 配置 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: 构建并推送后端镜像
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push \
            --build-arg APP_VERSION=${{ env.VERSION }} \
            -t bats666/springboot-backend:latest \
            -t bats666/springboot-backend:${{ env.VERSION }} \
            ./springboot-backend

  create-release:
    name: 创建 Release
    needs: [build-gost, build-vite, build-java]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - name: 下载 AMD64 产物
        uses: actions/download-artifact@v4
        with:
          name: gost-binary-amd64
          path: ./artifacts/amd64

      - name: 下载 ARM64 产物
        uses: actions/download-artifact@v4
        with:
          name: gost-binary-arm64
          path: ./artifacts/arm64

      - name: 重命名二进制文件
        run: |
          mv ./artifacts/amd64/gost-amd64 ./artifacts/gost-amd64
          mv ./artifacts/arm64/gost-arm64 ./artifacts/gost-arm64

      - name: 创建 Release 并上传文件
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ env.VERSION }}"

          gh release delete "${VERSION}" --yes --repo ${{ github.repository }} 2>/dev/null || true
          git push origin --delete "${VERSION}" 2>/dev/null || true

          git tag "${VERSION}" ${{ github.sha }}
          git push origin "${VERSION}"

          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          COMMIT_AUTHOR=$(git log -1 --pretty=format:"%an")
          COMMIT_DATE=$(git log -1 --pretty=format:"%ai")

          gh release create "${VERSION}" \
            --title "Release ${VERSION}" \
            --notes "## 📝 提交信息
          - **内容**: ${COMMIT_MSG}
          - **作者**: ${COMMIT_AUTHOR}
          - **时间**: ${COMMIT_DATE}
          - **Commit**: [\`${GITHUB_SHA:0:7}\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})" \
            --repo ${{ github.repository }}

          gh release upload "${VERSION}" ./artifacts/gost-amd64 --clobber
          gh release upload "${VERSION}" ./artifacts/gost-arm64 --clobber
          gh release upload "${VERSION}" ./install.sh --clobber
          gh release upload "${VERSION}" ./panel_install.sh --clobber
          gh release upload "${VERSION}" ./docker-compose-v4.yml --clobber
          gh release upload "${VERSION}" ./docker-compose-v6.yml --clobber

          echo "✅ Release ${VERSION} 发布完成"
