services:
  mysql:
    image: mysql:5.7
    container_name: flux-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - gost-network
    healthcheck:
      test: ["CMD", "sh", "-c", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  backend:
    image: bats666/springboot-backend:1.6.16
    container_name: springboot-backend
    restart: unless-stopped
    environment:
      # --- MySQL 模式（默认）---
      DB_TYPE: mysql
      DB_DRIVER: com.mysql.cj.jdbc.Driver
      DB_URL: jdbc:mysql://flux-mysql:3306/${DB_NAME}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_USERNAME: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_INIT_MODE: always
      # --- SQLite 模式（切换方法）---
      # 1. 删除上方所有 DB_* 变量
      # 2. 取消注释以下三行
      # 3. 删除下方 depends_on mysql 条件
      # 4. 在 volumes 中取消注释 sqlite_data 相关行
      # DB_TYPE: sqlite
      # DB_DRIVER: org.sqlite.JDBC
      # DB_URL: jdbc:sqlite:/app/data/flux.db
      JWT_SECRET: ${JWT_SECRET}
      LOG_DIR: /app/logs
      JAVA_OPTS: "-Xms256m -Xmx512m -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai"
    ports:
      - "${BACKEND_PORT}:6365"
    volumes:
      - backend_logs:/app/logs
      # SQLite 模式时取消注释以下行，用于持久化数据库文件
      # - sqlite_data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - gost-network
    stop_grace_period: 30s
    stop_signal: SIGTERM
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --no-verbose --tries=1 --spider http://localhost:6365/flow/test || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  sort-proxy:
    image: flux-sort-proxy:latest
    container_name: flux-sort-proxy
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:6365
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASS: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      PORT: "6367"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - gost-network

  frontend:
    image: bats666/vite-frontend:1.6.16
    container_name: vite-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - sort-proxy
    networks:
      - gost-network


volumes:
  mysql_data:
    name: mysql_data
    driver: local
  backend_logs:
    name: backend_logs
    driver: local
  # SQLite 模式时取消注释
  # sqlite_data:
  #   name: sqlite_data
  #   driver: local


networks:
  gost-network:
    name: gost-network
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.20.0.0/16
        - subnet: fd00:dead:beef::/48
